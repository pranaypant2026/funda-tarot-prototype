<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funda Tarot · prototype</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #111216; --panel: #1C1D22; --line: #30323B; --text: #F1E2CC; --muted: #B5AEBF; --accent: #FF7D3A; --violet: #B9A6FF; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Mukta', system-ui, sans-serif; }
#app { min-height: 100%; }
.layout { display: flex; gap: 40px; align-items: flex-start; justify-content: center; padding: 32px 24px; }
.side { width: 240px; position: sticky; top: 32px; }
.side h1 { font-family: 'Baloo 2', sans-serif; font-size: 26px; margin: 0 0 2px; }
.side p { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.4; }
.side button { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--text);
  font: 500 16px 'Mukta', sans-serif; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.side button:hover { background: #1C1D22; }
.side button[aria-current="true"] { background: #26272E; border-color: #7D5CE8; color: #fff; }
.phone { width: 412px; height: 866px; border-radius: 52px; background: #000; padding: 11px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #2a2b31; flex-shrink: 0; }
.screen { width: 390px; height: 844px; border-radius: 42px; overflow-y: auto; overflow-x: hidden; background: var(--panel); position: relative; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
.screen.center { display: flex; align-items: center; justify-content: center; background: #0d0e11; }
.menu-btn { display: none; }
.sheet { display: none; }
@media (max-width: 720px) {
  .layout { padding: 0; display: block; }
  .side { display: none; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; background: var(--panel); overflow: hidden; }
  .screen { width: 390px; height: calc(100dvh / var(--z)); border-radius: 0; zoom: var(--z); }
  .screen.fit > div:first-child { height: 100% !important; min-height: 600px; }
  .menu-btn { display: flex; position: fixed; right: 0; top: 46%; z-index: 50; width: 30px; height: 52px; border-radius: 12px 0 0 12px;
    border: 1px solid #7D5CE8; border-right: 0; background: rgba(28,29,34,.85); color: var(--violet); align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .sheet.open { display: block; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); }
  .sheet .inner { position: absolute; left: 0; right: 0; bottom: 0; background: #1C1D22; border-radius: 20px 20px 0 0; padding: 16px 16px 28px; }
  .sheet button { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: var(--text); font: 500 17px 'Mukta', sans-serif; padding: 11px 8px; border-bottom: 1px solid #2a2b31; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.DC_VERSION = "7";  /* bump on every deploy so phones fetch fresh screens */</script>
<script src="dc-lite.js?v=7"></script>
</head>
<body>
<div id="app"></div>
<script>
const SCREENS = [
  ['Onboarding', '1 · Onboarding'], ['Main', '2 · Tarot home'], ['Spread', '3 · Choose a reading'], ['Pick', '4 · Pick & reveal cards'],
  ['Readers', '5 · Readers'], ['Reader', '6 · Reader profile'], ['Chat', '7 · Chat + palm photos'], ['Daily', '8 · Daily card'],
  ['Status', '9 · WhatsApp status'], ['Diary', '10 · Tarot diary']
];
const h = React.createElement;
const FIT = new Set(['Onboarding', 'Spread', 'Pick', 'Chat', 'Diary']);  // fixed-height screens fill the phone's real height
// ?mode=app: shareable app-style view (no step list or screen menu, opens on the Tarot home)
const APP = new URLSearchParams(location.search).get('mode') === 'app';
// the visitor's own details from onboarding (kept on this device only)
try { window.TAROT_USER = JSON.parse(localStorage.getItem('funda_tarot_user') || 'null'); } catch (e) { window.TAROT_USER = null; }
const current = () => { const n = decodeURIComponent(location.hash.slice(1)); return SCREENS.some(s => s[0] === n) ? n : (APP && window.TAROT_USER ? 'Main' : 'Onboarding'); };

function App() {
  const [screen, setScreen] = React.useState(current());
  const [visit, setVisit] = React.useState(0);
  const [menu, setMenu] = React.useState(false);
  const box = React.useRef(null);
  React.useEffect(() => {
    window.dcNavigate = (n) => { location.hash = n; };
    const on = () => { setScreen(current()); setVisit(v => v + 1); setMenu(false); if (box.current) box.current.scrollTop = 0; };
    window.addEventListener('hashchange', on);
    // size from the device width (not innerWidth, which grows if anything overflows and would feed back into the zoom)
    const z = () => document.documentElement.style.setProperty('--z', String(Math.min(Math.min(window.screen.width || 390, document.documentElement.clientWidth) / 390, 1.25)));
    z(); window.addEventListener('resize', z);
    return () => { window.removeEventListener('hashchange', on); window.removeEventListener('resize', z); };
  }, []);
  const go = (n) => { if (n === screen) { setVisit(v => v + 1); setMenu(false); } else location.hash = n; };
  const list = SCREENS.map(([n, label]) => h('button', { key: n, type: 'button', 'aria-current': String(n === screen), onClick: () => go(n) }, label));
  const Comp = dcLite.registry[screen];
  const phone = h('div', { className: 'phone' },
      h('div', { className: 'screen' + (screen === 'Status' ? ' center' : '') + (FIT.has(screen) ? ' fit' : ''), ref: box }, h(Comp, { key: screen + ':' + visit })));
  if (APP) return h('div', { className: 'layout' }, phone);
  return h('div', { className: 'layout' },
    h('nav', { className: 'side', 'aria-label': 'Screens' },
      h('h1', null, 'Funda Tarot'), h('p', null, 'Clickable prototype. Tap through the screens on the phone, or jump here.'), ...list),
    h('div', { className: 'phone' },
      h('div', { className: 'screen' + (screen === 'Status' ? ' center' : '') + (FIT.has(screen) ? ' fit' : ''), ref: box }, h(Comp, { key: screen + ':' + visit }))),
    h('button', { className: 'menu-btn', type: 'button', 'aria-label': 'All screens', onClick: () => setMenu(true) },
      h('svg', { viewBox: '0 0 24 24', width: 22, height: 22, fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' }, h('path', { d: 'M4 7h16M4 12h16M4 17h16' }))),
    h('div', { className: 'sheet' + (menu ? ' open' : ''), onClick: (e) => { if (e.target === e.currentTarget) setMenu(false); } },
      h('div', { className: 'inner' }, ...list)));
}

(async () => {
  await dcLite.load('TarotCard');
  for (const [n] of SCREENS) await dcLite.load(n);
  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
</html>
