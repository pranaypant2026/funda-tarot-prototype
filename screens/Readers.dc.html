<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#1C1D22}
a{color:#FFB07F}a:hover{color:#FFCBA8}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #1C1D22; color: #F1E2CC; font-family: 'Mukta', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 56px; padding: 0 16px 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; color: #F1E2CC; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 21px">Choose a reader</div>
</div>
<div style="padding: 0 20px 14px; font-size: 16px; color: #B5AEBF">Talk to whoever you connect with. Every reader can see your cards.</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 16px">
<sc-for list="{{readers}}" as="r" hint-placeholder-count="5">
<div style="border-radius: 18px; background: #26272E; border: 1px solid #3B3D48; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="position: relative; flex-shrink: 0">
<div style="width: 72px; height: 72px; border-radius: 50%; padding: 2.5px; box-sizing: border-box; background: linear-gradient(140deg, #7D5CE8, #FF7D3A)">
<img src="{{r.photo}}" alt="{{r.name}}" style="width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #26272E; box-sizing: border-box; object-fit: cover; display: block">
</div>
<span style="position: absolute; right: 3px; bottom: 4px; width: 14px; height: 14px; border-radius: 50%; background: #5BD08A; border: 2.5px solid #26272E"></span>
</div>
<div style="min-width: 0">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.15">{{r.name}}</div>
<div style="font-size: 15px; color: #FFB07F; font-weight: 600">{{r.focus}}</div>
<div style="font-size: 14px; color: #B5AEBF">{{r.style}}</div>
</div>
</div>
<div style="font-size: 13px; color: #B5AEBF">Speaks: {{r.langs}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Reader.dc.html" style="height: 46px; border-radius: 14px; border: 1.5px solid #7D5CE8; color: #B9A6FF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Profile</a>
<a href="Chat.dc.html" style="height: 46px; border-radius: 14px; background: #FF7D3A; color: #1C1D22; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Chat now</a>
</div>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      readers: [
        { init: 'आ', photo: 'assets/readers/aarohi.jpg', name: 'Aarohi', focus: 'Love, Relationships, Marriage', style: 'Talks from the heart, like an elder sister', langs: 'Hinglish, Hindi', tone: '#7A3E66' },
        { init: 'क', photo: 'assets/readers/kabir.jpg', name: 'Kabir', focus: 'Job, Career, Studies', style: 'Straight talk, a clear next step', langs: 'Hinglish, Hindi', tone: '#2F4A7A' },
        { init: 'रा', photo: 'assets/readers/raghav.jpg', name: 'Raghav', focus: 'Money, Earning, Business', style: 'Money talk, calm and clear', langs: 'Hinglish, Hindi', tone: '#2F6247' },
        { init: 'शा', photo: 'assets/readers/sharda.jpg', name: 'Sharda Maa', focus: 'Peace of mind, Family, Upay', style: 'A mother’s warmth, the right upay', langs: 'Hindi, Hinglish', tone: '#7A5A2F' },
        { init: 'ल', photo: 'assets/readers/lakshmi.jpg', name: 'Lakshmi', focus: 'Family, Any question', style: 'In your own language', langs: 'Telugu, Kannada, Tamil, Hindi', tone: '#5B3FA0' }
      ]
    };
  }
}
</script>
</body>
</html>
