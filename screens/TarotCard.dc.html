<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tarot card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; perspective: 900px; font-family: 'Mukta', sans-serif; color: #2A2340">
<div style="position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(.2,.7,.2,1); transform: {{flip}}">
<div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: {{r}}px; overflow: hidden; background: #17181D; border: 1.5px solid #C9A25A; box-shadow: 0 6px 18px rgba(0,0,0,0.45); box-sizing: border-box">
<img src="assets/cards/back.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
</div>
<sc-if value="{{hasArt}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); border-radius: {{r}}px; padding: {{pad}}px; box-sizing: border-box; background: linear-gradient(150deg, #F2CF8A, #FF7D3A 45%, #7D5CE8); box-shadow: 0 6px 18px rgba(0,0,0,0.45)">
<div style="position: relative; width: 100%; height: 100%; border-radius: {{r2}}px; overflow: hidden; background: #17181D">
<img src="{{art}}" alt="{{hi}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill">
<sc-if value="{{artLabel}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: 5%; left: 50%; transform: translateX(-50%); font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: {{fsNum}}px; line-height: 1.1; color: #F6D79B; background: rgba(16,12,28,0.72); border: 1px solid rgba(246,215,155,0.6); border-radius: 999px; padding: 2px 9px">{{numeral}}</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22% 6% 7%; background: linear-gradient(180deg, rgba(16,12,28,0), rgba(16,12,28,0.92) 55%); text-align: center; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: {{fsName}}px; line-height: 1.1; color: #F6E7CF">{{hi}}</div>
</sc-if>
</div>
</div>
</sc-if>
<sc-if value="{{noArt}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(180deg); border-radius: {{r}}px; padding: {{pad}}px; box-sizing: border-box; background: linear-gradient(150deg, #7D5CE8, #B45CC8 55%, #FF7D3A); box-shadow: 0 6px 18px rgba(0,0,0,0.45)">
<div style="width: 100%; height: 100%; box-sizing: border-box; border-radius: {{r2}}px; background: #F4E7D4; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: {{innerPad}}">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: {{fsNum}}px; line-height: 1; color: #5B3FCF">{{numeral}}</div>
<svg viewBox="0 0 24 24" style="width: {{gw}}px; height: {{gw}}px" fill="none" stroke="#5B3FCF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{glyph}}"></path></svg>
<sc-if value="{{showName}}" hint-placeholder-val="{{true}}">
<div style="text-align: center; line-height: 1.15">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: {{fsName}}px; color: #2A2340">{{hi}}</div>
<div style="font-size: {{fsEn}}px; letter-spacing: 0.06em; color: #5A4E6E; font-weight: 600">{{en}}</div>
</div>
</sc-if>
<sc-if value="{{hideName}}" hint-placeholder-val="{{false}}">
<div style="height: 2px"></div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cardId":{"editor":"int","default":17,"min":0,"max":77},"size":{"editor":"enum","options":["s","m","l","xl"],"default":"l"},"face":{"editor":"boolean","default":true},"reversed":{"editor":"boolean","default":false},"$preview":{"width":150,"height":246}}'>
class Component extends DCLogic {
  tables() {
    if (this._t) return this._t;
    var C = function (cx, cy, r) { return 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0'; };
    var G = {
      sun: C(12, 12, 4) + 'M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8',
      moon: 'M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z',
      star: 'M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z',
      heart: 'M12 20.5s-8-4.9-8-11A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5c0 6.1-8 11-8 11z',
      eye: 'M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z' + C(12, 12, 3),
      lantern: 'M10 3h4M12 3v2M8.5 7h7l1 2.5v8l-1 2.5h-7l-1-2.5v-8zM12 11.5c1 1 1.4 2 0 3.5-1.4-1.5-1-2.5 0-3.5z',
      scales: 'M12 3.5v17M7 20.5h10M4.5 7h15M4.5 7L2 13a2.5 2.5 0 0 0 5 0zM19.5 7L17 13a2.5 2.5 0 0 0 5 0z',
      wheel: C(12, 12, 9) + C(12, 12, 2.5) + 'M12 3v6.5M12 14.5V21M3 12h6.5M14.5 12H21M5.6 5.6l4.6 4.6M13.8 13.8l4.6 4.6M5.6 18.4l4.6-4.6M13.8 10.2l4.6-4.6',
      crown: 'M3 18.5h18M4 18.5L3 7.5l5 4.5 4-6.5 4 6.5 5-4.5-1 11',
      bolt: 'M13 2L4 13.5h7L10 22l9-11.5h-7z',
      infinity: 'M12 12c-1.8-2.4-3.6-3.8-5.5-3.8a3.8 3.8 0 0 0 0 7.6c1.9 0 3.7-1.4 5.5-3.8zm0 0c1.8 2.4 3.6 3.8 5.5 3.8a3.8 3.8 0 0 0 0-7.6c-1.9 0-3.7 1.4-5.5 3.8z',
      key: C(8, 8, 4.5) + 'M11.2 11.2l9.3 9.3M17 17l2.2-2.2M14.5 14.5l2-2',
      flame: 'M12 21.5a6.5 6.5 0 0 0 6.5-6.5c0-4.5-4-7-5-11.5-2.5 2.5-3.5 5-3 7.5-1.2-.8-2-2-2.2-3.3C6.6 9.4 5.5 11.8 5.5 15a6.5 6.5 0 0 0 6.5 6.5z',
      globe: C(12, 12, 9) + 'M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z',
      mountain: 'M2 20h20L14.5 8 11 13.5l-2.5-3z' + C(18, 5, 2),
      lotus: 'M12 20.5c-4.4 0-8.5-2.8-8.5-7 3.2 0 6.4 2 8.5 5 2.1-3 5.3-5 8.5-5 0 4.2-4.1 7-8.5 7zM12 18.5c-2.3-3.4-2.3-8 0-12 2.3 4 2.3 8.6 0 12z',
      arrow: 'M3 12h16M13 6l6 6-6 6' + C(6, 18.5, 2),
      hourglass: 'M6 2.5h12M6 21.5h12M7 2.5c0 5.5 10 5.5 10 9.5s-10 4-10 9.5M17 2.5c0 5.5-10 5.5-10 9.5s10 4 10 9.5',
      sunrise: 'M2.5 18h19M6 18a6 6 0 0 1 12 0M12 5v3M4.6 9.6l2 2M19.4 9.6l-2 2M5.5 21.5h13',
      waves: 'M2.5 9c3-3 6.5 3 9.5 0s6.5 3 9.5 0M2.5 15c3-3 6.5 3 9.5 0s6.5 3 9.5 0',
      chains: 'M10 7.5H8a4.5 4.5 0 0 0 0 9h2M14 7.5h2a4.5 4.5 0 0 1 0 9h-2M8 12h8',
      bell: 'M6 16.5V11a6 6 0 0 1 12 0v5.5l2 2H4zM10 21a2 2 0 0 0 4 0M12 3v2',
      wand: 'M4 20L17 7M15 5l4 4M8 13.5c-1.5-.5-2.5 0-3 1.5 1.5.5 2.5 0 3-1.5zM18.5 2.5v3M17 4h3',
      cup: 'M6 3.5h12V8a6 6 0 0 1-12 0zM12 14v5M8 20.5h8',
      sword: 'M19.5 4.5L9 15M19.5 4.5h-4M19.5 4.5v4M6 12l6 6M4 20l3.5-3.5',
      coin: C(12, 12, 9) + 'M12 7l1.5 3.1 3.4.5-2.5 2.4.6 3.4-3-1.6-3 1.6.6-3.4-2.5-2.4 3.4-.5z'
    };
    var MAJOR = [
      ['0', 'द फ़ूल', 'THE FOOL', 'mountain'], ['I', 'द मैजिशियन', 'THE MAGICIAN', 'infinity'],
      ['II', 'द हाई प्रीस्टेस', 'THE HIGH PRIESTESS', 'eye'], ['III', 'द एम्प्रेस', 'THE EMPRESS', 'lotus'],
      ['IV', 'द एम्परर', 'THE EMPEROR', 'crown'], ['V', 'द हायरोफ़ैंट', 'THE HIEROPHANT', 'key'],
      ['VI', 'द लवर्स', 'THE LOVERS', 'heart'], ['VII', 'द चैरियट', 'THE CHARIOT', 'arrow'],
      ['VIII', 'स्ट्रेंथ', 'STRENGTH', 'flame'], ['IX', 'द हर्मिट', 'THE HERMIT', 'lantern'],
      ['X', 'व्हील ऑफ़ फ़ॉर्च्यून', 'WHEEL OF FORTUNE', 'wheel'], ['XI', 'जस्टिस', 'JUSTICE', 'scales'],
      ['XII', 'द हैंग्ड मैन', 'THE HANGED MAN', 'hourglass'], ['XIII', 'डेथ (बदलाव)', 'DEATH', 'sunrise'],
      ['XIV', 'टेम्परेंस', 'TEMPERANCE', 'waves'], ['XV', 'द डेविल', 'THE DEVIL', 'chains'],
      ['XVI', 'द टावर', 'THE TOWER', 'bolt'], ['XVII', 'द स्टार', 'THE STAR', 'star'],
      ['XVIII', 'द मून', 'THE MOON', 'moon'], ['XIX', 'द सन', 'THE SUN', 'sun'],
      ['XX', 'जजमेंट', 'JUDGEMENT', 'bell'], ['XXI', 'द वर्ल्ड', 'THE WORLD', 'globe']
    ];
    var SUITS = [['डंडे', 'WANDS', 'wand'], ['प्याले', 'CUPS', 'cup'], ['तलवारें', 'SWORDS', 'sword'], ['सिक्के', 'PENTACLES', 'coin']];
    var RANKS = [['इक्का', 'ACE', 'A'], ['दो', 'TWO', '2'], ['तीन', 'THREE', '3'], ['चार', 'FOUR', '4'], ['पाँच', 'FIVE', '5'], ['छह', 'SIX', '6'], ['सात', 'SEVEN', '7'], ['आठ', 'EIGHT', '8'], ['नौ', 'NINE', '9'], ['दस', 'TEN', '10'], ['सेवक', 'PAGE', 'P'], ['योद्धा', 'KNIGHT', 'Kn'], ['रानी', 'QUEEN', 'Q'], ['राजा', 'KING', 'K']];
    var SIZES = {
      s: { w: 56, h: 92, r: 7, pad: 2, fsNum: 10, gw: 26, name: false },
      m: { w: 100, h: 164, r: 10, pad: 3, fsNum: 13, gw: 44, fsName: 13, fsEn: 7, name: true },
      l: { w: 150, h: 246, r: 14, pad: 4, fsNum: 16, gw: 70, fsName: 18, fsEn: 9, name: true },
      xl: { w: 200, h: 328, r: 18, pad: 5, fsNum: 20, gw: 96, fsName: 24, fsEn: 11, name: true }
    };
    var info = function (id) {
      id = Math.max(0, Math.min(77, id | 0));
      var tc = function (x) { return x.toLowerCase().replace(/(^|\s)([a-z])/g, function (a, b, c) { return b + c.toUpperCase(); }).replace(/ Of /g, ' of '); };
      if (id < 22) { var m = MAJOR[id]; return { numeral: m[0], hi: tc(m[2]), en: '', glyph: G[m[3]] }; }
      var k = id - 22, s = SUITS[Math.floor(k / 14)], r = RANKS[k % 14];
      return { numeral: r[2], hi: tc(r[1] + ' OF ' + s[1]), en: '', glyph: G[s[2]] };
    };
    this._t = { SIZES: SIZES, info: info };
    return this._t;
  }
  renderVals() {
    var t = this.tables();
    var sz = t.SIZES[this.props.size ?? 'l'] || t.SIZES.l;
    var face = this.props.face ?? true;
    var c = t.info(this.props.cardId ?? 17);
    return {
      w: sz.w, h: sz.h, r: sz.r, r2: Math.max(3, sz.r - 3), pad: sz.pad, inset: sz.pad + 2,
      innerPad: sz.name ? '8% 6% 7%' : '12% 4%',
      fsNum: sz.fsNum, gw: sz.gw, fsName: sz.fsName || 12, fsEn: sz.fsEn || 7,
      showName: sz.name, hideName: !sz.name,
      flip: face ? (this.props.reversed ? 'rotateY(180deg) rotateZ(180deg)' : 'rotateY(180deg)') : 'rotateY(0deg)',
      numeral: c.numeral, hi: c.hi, en: c.en, glyph: c.glyph,
      art: 'assets/cards/rws/' + ('0' + Math.max(0, Math.min(77, (this.props.cardId ?? 17) | 0))).slice(-2) + '.jpg', hasArt: true, noArt: false, artLabel: false
    };
  }
}
</script>
</body>
</html>
